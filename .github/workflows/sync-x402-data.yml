name: Sync x402 Data

# Walks the x402 facilitator's transaction history on Abstract and commits
# the updated ledger to data/x402-snapshot.json. Vercel auto-deploys on
# push to main, so this commit is what actually refreshes the live site's
# stats — see scripts/sync-snapshot.mjs and src/lib/snapshot.ts.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-x402-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync snapshot
        run: node scripts/sync-snapshot.mjs

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- data/x402-snapshot.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "x402-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/x402-snapshot.json
          git commit -m "sync: update x402 snapshot"
          git push
